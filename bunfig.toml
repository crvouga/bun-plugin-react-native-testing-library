[test]
preload = ["./src/preload.ts"]
# Consumer sandboxes have their own package.json / bunfig; run via integration spawn.
# Canary probes are spawned by scripts/run-canaries.ts, not the main suite.
pathIgnorePatterns = ["test/real-world/**", "test/real-world-expo/**", "test/meta/canaries/probes/**"]

# Coverage: `bun test --coverage` (see package.json).
