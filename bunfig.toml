[test]
preload = ["./src/preload.ts"]
# Consumer sandboxes + Jest-only oracle fixture are spawned by dedicated stages.
pathIgnorePatterns = [
  "test/real-world/**",
  "test/real-world-expo/**",
  "test/oracle/jest-fixture/**",
  "test/oracle/bun-traces.test.tsx",
]

# Coverage: `bun test --coverage` (see package.json).
