# Local replica: bun run check:full (delegates to bun check)
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  HUSKY: "0"

jobs:
  commitlint:
    name: Commitlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Note push commitlint policy
        if: github.event_name == 'push'
        run: |
          set +e
          bunx commitlint --last --verbose
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::warning::HEAD is not Conventional Commits. Enforced on PRs."
          fi

      - name: Validate PR commits
        if: github.event_name == 'pull_request'
        run: |
          set +e
          bunx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::One or more PR commits failed Conventional Commits lint."
            exit "$status"
          fi

      - name: Validate PR title
        if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          subjectPattern: .+
          subjectPatternError: |
            The PR title "{title}" looks empty after the type/scope prefix.
            Use a Conventional Commits title, e.g. "feat: add library shim".

  check-linux:
    name: bun check (Linux / Bun 1.4.0)
    needs: [commitlint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: bun check
        run: bun check

      - name: Require RELEASE READY report
        run: |
          test -f compat/release-report.json
          node -e 'const r=require("./compat/release-report.json"); if(!r.ok||r.sentinel!=="RELEASE READY: bun check passed") process.exit(1)'

      - name: Upload release report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-report-linux
          path: |
            compat/release-report.json
            compat/matrix-report.json
            compat/oracle-report.json
            compat/coverage-manifest.json

  check-macos:
    name: bun check (macOS / Bun latest)
    needs: [commitlint]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: bun check
        run: bun check

      - name: Require RELEASE READY report
        run: |
          test -f compat/release-report.json
          node -e 'const r=require("./compat/release-report.json"); if(!r.ok||r.sentinel!=="RELEASE READY: bun check passed") process.exit(1)'

      - name: Upload release report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-report-macos
          path: |
            compat/release-report.json
            compat/matrix-report.json
            compat/oracle-report.json
            compat/coverage-manifest.json

  release:
    name: Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [commitlint, check-linux, check-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org

      - name: Ensure npm supports Trusted Publishing
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: bun check (release axis)
        run: bun check

      - name: Require RELEASE READY report
        run: |
          test -f compat/release-report.json
          node -e 'const r=require("./compat/release-report.json"); if(!r.ok||r.sentinel!=="RELEASE READY: bun check passed") process.exit(1)'

      - name: Release preflight
        run: bun run release:preflight

      - name: Seed npm package if missing
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run npm:seed -- --ci

      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bunx semantic-release
