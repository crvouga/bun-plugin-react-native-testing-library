# Declarative inventory of release / dry-run credentials.
# Consumed by scripts/secrets/*.ts — never commit secret values.
#
# Publishing uses npm Trusted Publishing (OIDC) — no NPM_TOKEN after seed.
# Vault paths are relative to mount (KV v2):
#   vault kv get -mount=<mount> -field=<key> <path>
#
# GitHub Actions built-in GITHUB_TOKEN is not listed (job permissions cover it).

repo: crvouga/bun-plugin-react-native-testing-library

# No repo Actions secrets are required for publish after Trusted Publishing is configured.
# Optional NPM_TOKEN is only for the one-time CI bootstrap when the package does not exist yet.
secrets:
  - id: gh_pat
    description: Optional GitHub PAT for local semantic-release dry-run only
    required: false
    vault:
      path: personal/prd/github
      key: GH_PAT
    github:
      name: null
      required: false
    local_env:
      - GH_PAT
      - GITHUB_TOKEN
    obtain:
      title: Create a GitHub personal access token (optional, local only)
      urls:
        - https://github.com/settings/tokens
      steps:
        - "Fine-grained or classic PAT with repo contents + issues/PRs as needed for dry-run"
        - "CI uses the built-in GITHUB_TOKEN — no repo secret required for Actions"
        - "Do not create an npm Automation token — use Trusted Publishing instead"
    populate:
      vault: |
        export VAULT_ADDR=https://vault.chrisvouga.dev
        printf '%s' "$GH_PAT" | vault kv put -mount=secret personal/prd/github GH_PAT=-
      github: |
        # Not synced to GitHub Actions secrets (Actions uses GITHUB_TOKEN).
        # For local dry-run only:
        export GITHUB_TOKEN="$(vault kv get -mount=secret -field=GH_PAT personal/prd/github)"

checklists:
  - id: oidc_trusted_publishing
    description: npm Trusted Publishing (OIDC) — required for CI publish
    required: true
    urls:
      - https://www.npmjs.com/package/bun-plugin-react-native-testing-library?activeTab=versions
      - https://www.npmjs.com/package/bun-plugin-react-native-testing-library
      - https://docs.npmjs.com/trusted-publishers
    steps:
      - "If the package is not on npm yet, seed it once: bun run npm:seed -- --yes (or NPM_TOKEN + bun run npm:seed -- --ci)"
      - "Open package → Settings / Access → Trusted Publisher (avoid Granular Access Tokens for CI)"
      - "Add GitHub Actions publisher"
      - "Organization/user: crvouga"
      - "Repository: bun-plugin-react-native-testing-library"
      - "Workflow filename: ci.yml"
      - "Environment: leave empty unless the release job uses one"
      - "Confirm release job has permissions.id-token: write (already set in .github/workflows/ci.yml)"
      - "Delete any temporary NPM_TOKEN after the first seed — not used for steady-state publish"
